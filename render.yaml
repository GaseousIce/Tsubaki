services:
    - type: web
      name: tsubaki-discord-bot
      runtime: python
      plan: free
      autoDeploy: true
      buildCommand: curl -LsSf https://astral.sh/uv/install.sh | sh && $HOME/.local/bin/uv sync
      startCommand: $HOME/.local/bin/uv run python src/main.py
      healthCheckPath: /health
      envVars:
          - key: PYTHON_VERSION
        value: 3.12.4
          - key: DISCORD_TOKEN
            sync: false
          - key: GROQ_API_KEY
            sync: false
          - key: GROQ_MODEL
            value: openai/gpt-oss-120b
