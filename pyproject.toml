[project]
name = "tsubaki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "discord-py>=2.7.1",
    "groq>=1.4.0",
    "libsql-client>=0.3.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.0",
    "simcord[pytest]>=1.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
